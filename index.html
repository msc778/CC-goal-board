<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1E6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CC的工作台">
<title>CC的工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%234C9A6A'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23EDF1E6'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#EDF1E6;--card:#FCFDF9;--card2:#F4F7EE;--line:#DCE4D4;--ink:#2F3A2E;--muted:#7A8578;
--green:#4C9A6A;--blue:#3E7CB1;--amber:#C08A3E;--purple:#8E6BBF;--coral:#D9706C;--pink:#D1789F;
--danger:#D64545;--warn:#D9922E;--radius:14px;--shadow:0 2px 10px rgba(47,58,46,.07);
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:.95rem;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
#app{display:flex;gap:16px;max-width:1500px;margin:0 auto;padding:16px;align-items:flex-start}
#sidebar{width:218px;position:sticky;top:16px;flex:none;display:flex;flex-direction:column;gap:12px}
#main{flex:1;min-width:0}
#rail{width:252px;position:sticky;top:16px;flex:none;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px}
.logo .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.logo .lg .ic{width:22px;height:22px;stroke-width:2}
.logo b{font-size:1.05rem;line-height:1.2}
.logo small{display:block;color:var(--muted);font-size:.72rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card h2{font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 .ic{color:var(--green)}
.card h4{font-size:.9rem;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.card h4 .ic{color:var(--green)}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;font-size:.95rem;font-weight:600;color:var(--ink);transition:.15s;text-align:left}
.nav-i:hover{background:var(--card2)}
.nav-i.active{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(76,154,106,.3)}
.nav-i.active .ic{color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:.9rem;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#3f8657;color:#fff}
.btn.danger{color:var(--danger);border-color:#f0c6c6}
.btn.danger:hover{background:#fdf1f1;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn.block{width:100%;justify-content:center}
.btn .ic{width:15px;height:15px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.75rem;color:#fff;font-weight:600}
.tag.risk{background:var(--danger)}
.tag.warn{background:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .5s}
.sec{margin-top:16px}
.sec>.card{margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:18px;font-size:.85rem;border:1px dashed var(--line);border-radius:10px;background:var(--card2)}
#tabbar{display:none}
#mhead{display:none}
.banner{position:relative;border-radius:18px;padding:20px 22px;color:#fff;overflow:hidden;margin-bottom:16px;box-shadow:0 6px 20px rgba(47,58,46,.12)}
.banner .banner-ribbon{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#f6d365,#fda085,#f6d365,#84fab0,#8fd3f4,#f6d365);background-size:300% 100%;animation:rib 6s linear infinite}
@keyframes rib{to{background-position:300% 0}}
.banner.day{background:linear-gradient(120deg,#4C9A6A,#6db489 55%,#7fb069)}
.banner.night{background:linear-gradient(120deg,#7a3b3b,#b04a3a 55%,#c98a3d)}
.banner .b-ic{position:absolute;right:18px;top:18px;width:40px;height:40px;opacity:.9}
.banner .b-ic .ic{width:40px;height:40px;stroke-width:1.4}
.banner h1{font-size:1.3rem;margin-bottom:6px;padding-right:54px}
.banner p{font-size:.9rem;opacity:.95;padding-right:54px}
.banner.night h1{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.78}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;position:relative}
.badge .badge-ic{width:38px;height:38px;margin:0 auto 6px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.badge .badge-ic .ic{width:22px;height:22px}
.badge b{display:block;font-size:.88rem;margin-bottom:2px}
.badge span{font-size:.75rem;color:var(--muted)}
.badge .bar{height:6px;margin-top:8px}
.badge.on{border-color:var(--amber);background:linear-gradient(160deg,#fff8e8,#fdeed2)}
.badge.on .badge-ic{color:var(--amber);background:#ffeecf}
.badge.on .bar i{background:linear-gradient(90deg,#e8a33d,#e86a8f)}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.layer{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.layer h4{font-size:.85rem;display:flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--ink)}
.layer h4 .ic{width:15px;height:15px}
.li{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:.82rem;cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover{background:var(--card2);border-radius:8px}
.li .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--muted);flex:none}
.todo{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:12px;margin-bottom:10px}
.todo.overdue{border-left-color:var(--danger);background:#fdf6f5}
.todo .t-main{flex:1;min-width:0}
.todo .t-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.todo .t-title{font-weight:600;font-size:.95rem}
.todo .t-desc{color:var(--muted);font-size:.82rem;margin-top:2px}
.todo .t-meta{color:var(--muted);font-size:.75rem;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.todo .t-actions{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.todo .t-actions .btn{padding:6px 10px;font-size:.8rem}
.od-badge{background:var(--danger);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 8px;font-weight:700}
.per-badge{background:var(--card2);color:var(--muted);border-radius:99px;font-size:.7rem;padding:1px 8px}
.todo .prog{margin-top:6px}
.done{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;opacity:.72}
.done .smile{color:var(--green);margin-top:2px}
.done .t-title{font-weight:600;font-size:.92rem}
.done .sum{color:#44523f;font-size:.82rem;margin-top:3px}
.done .rev{color:var(--muted);font-size:.8rem;margin-top:2px;background:var(--card2);border-radius:8px;padding:6px 8px}
.done .praise{color:var(--green);font-size:.78rem;font-weight:700;white-space:nowrap}
.goal{border-top:4px solid var(--green)}
.goal.danger{border-top-color:var(--danger)}
.goal.warn{border-top-color:var(--warn)}
.g-head{display:flex;gap:14px;align-items:center}
.ring{width:104px;height:104px;flex:none}
.ring .ring-bg{fill:none;stroke:var(--line);stroke-width:9}
.ring .ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
.ring .ring-n{font-size:19px;font-weight:700;fill:var(--ink)}
.ring .ring-l{font-size:10px;fill:var(--muted)}
.g-info{flex:1;min-width:0}
.g-tags{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.g-info h3{font-size:1.1rem}
.g-info p{color:var(--muted);font-size:.83rem;margin-top:2px}
.g-meta{display:flex;gap:18px;margin-top:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.g-meta span{display:flex;align-items:center;gap:4px}
.g-meta b{color:var(--ink)}
.g-meta .ic{width:14px;height:14px;color:var(--green)}
.g-bars{margin-top:12px}
.g-bar-title{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.chart{width:100%;height:84px}
.chart .cb{fill:var(--green)}
.chart .cb.off{fill:var(--line)}
.chart .bar-n{font-size:10px;fill:var(--muted);text-anchor:middle}
.chart .bar-w{font-size:10px;fill:var(--muted);text-anchor:middle}
.g-done{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.g-done-i{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.85rem;opacity:.75}
.g-done-i .ic{color:var(--green);width:16px;height:16px}
.g-done-i em{color:var(--green);font-style:normal;font-size:.78rem;margin-left:auto}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal-head b{font-size:1.05rem;flex:0 0 auto;text-align:center}
.cal-head.rep-head{justify-content:center}
.cal-head.rep-head b{flex:0 0 auto;order:0;min-width:0}
.cal-grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:6px}
.cal-w{text-align:center;font-size:.75rem;color:var(--muted);padding:2px 0}
.cal-cell{min-height:72px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;position:relative;transition:.12s}
.cal-cell:hover{border-color:var(--green);box-shadow:var(--shadow)}
.cal-cell.dim{opacity:.45}
.cal-cell.today{border-color:var(--green);background:#f2f8f1;box-shadow:0 0 0 1px var(--green)}
.cal-d{font-size:.75rem;color:var(--muted);font-weight:600;display:block;padding:2px 4px}
.cal-cell.today .cal-d{color:var(--green)}
.cal-chip{font-size:.68rem;padding:2px 6px;border-radius:6px;background:var(--c,#4C9A6A);border-left:3px solid rgba(255,255,255,.4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.cal-more{font-size:.68rem;color:var(--muted);margin-top:2px;text-align:center}
.cal-tabs{display:inline-flex;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:2px}
.cal-tabs button{padding:4px 10px;font-size:.8rem;border-radius:7px;color:var(--muted)}
.cal-tabs button.on{background:var(--green);color:#fff;font-weight:600}
.cal-wk{display:flex;align-items:center;justify-content:center;min-width:36px;white-space:nowrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;font-size:.68rem;color:var(--muted);cursor:pointer;transition:.12s;min-height:56px;align-self:stretch}
.cal-wk:hover{border-color:var(--green);color:var(--green);box-shadow:var(--shadow)}
.cal-wk-tl{--hlw:36px;display:flex;flex-direction:column;gap:1px;background:#E3E6EA;border-radius:10px;overflow:hidden;margin-top:4px}
.cal-wk-days{display:flex;gap:1px;background:#fff}
.cal-wk-dates{display:flex;gap:1px;background:#fff}
.cal-wk-sp{width:var(--hlw);flex:none}
.cal-wk-day{flex:1;min-width:0;text-align:center;font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 2px 0}
.cal-wk-date{flex:1;min-width:0;text-align:center;font-size:.68rem;color:var(--muted);padding:0 2px 5px}
.cal-wk-date.today{color:var(--green);font-weight:700}
.cal-wk-allrow{display:flex;gap:1px}
.cal-wk-lbl{width:var(--hlw);flex:none;background:#EAF3EA;display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.cal-wk-lbl span{font-size:.6rem;color:#6f8f77;writing-mode:vertical-rl}
.cal-wk-allcell{flex:1;min-width:0;min-height:64px;background:#EAF3EA;padding:4px 3px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-wk-allcell.alt{background:#E2EEE2}
.cal-wk-allcell .cal-chip{font-size:.6rem;padding:3px 4px;margin:0;width:100%;border-left:none;border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-wk-allcell>span{font-size:.58rem;color:var(--muted);align-self:center}
.cal-wk-grid{display:flex;gap:1px;position:relative}
.cal-wk-labels{width:var(--hlw);flex:none;background:#fff}
.cal-wk-lbl-row{height:32px;font-size:.62rem;color:var(--muted);text-align:right;padding-right:4px;padding-top:2px;user-select:none;white-space:nowrap}
.cal-wk-col{flex:1;min-width:0;position:relative;height:608px;background:#F4F5F7;overflow:hidden}
.cal-wk-col.alt{background:#EBEDF1}
.cal-wk-col.today{box-shadow:inset 0 0 0 1px var(--green)}
.cal-wk-row{position:absolute;left:0;right:0;height:32px;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer}
.cal-wk-row:hover{background:rgba(76,154,106,.05)}
.cal-wk-col .cal-block{left:0;right:0;border-left:none;border-radius:4px;padding:1px 3px;font-size:.62rem;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;overflow:hidden}
.cal-wk-col .cal-block b{font-size:.64rem}
.cal-wk-col .cal-block small{display:none}
.cal-wk-grid .cal-now{left:calc(var(--hlw) + 1px);right:0}
.cal-now{position:absolute;left:6px;right:0;height:2px;background:var(--danger);z-index:6;pointer-events:none}
.cal-now::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.cal-block{position:absolute;left:6px;right:6px;border-left:4px solid rgba(255,255,255,.4);background:var(--c,#4C9A6A);border-radius:8px;padding:2px 6px;font-size:.75rem;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);z-index:2;color:#fff}
.cal-block:hover{filter:brightness(.92)}
.cal-block b{display:block;font-size:.78rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.cal-block small{color:rgba(255,255,255,.85);font-size:.68rem}
.cal-block.done{opacity:.55}
#modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.ov{position:absolute;inset:0;background:rgba(47,58,46,.4)}
.md{position:relative;background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.md h3{font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.md h3 .ic{color:var(--green)}
.md label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.md-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.md-body{color:var(--muted);font-size:.9rem;line-height:1.6}
.code{width:100%;min-height:180px;font-family:Consolas,Menlo,monospace;font-size:.78rem;line-height:1.5;background:var(--card2)}
.eval{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.eval b{color:var(--green);font-size:.85rem;display:block;margin-bottom:4px}
.eval p{font-size:.85rem;color:var(--ink);line-height:1.6}
.eval.cross{border-color:#dcd3f0;background:#f6f3fc}
.eval.cross b{color:var(--purple)}
.tradio{display:inline-flex;align-items:center;gap:6px;margin:6px 10px 0 0;font-size:.85rem;cursor:pointer}
.tradio input{width:auto}
#ck-type{display:flex;gap:8px;flex-wrap:nowrap;align-items:center}
#ck-type .tradio{flex:1;justify-content:center;margin:6px 0 0 0;white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink);margin-top:10px}
.chk input{width:auto}
.wd-cb{border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:0;cursor:pointer;background:var(--card)}
.switch{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:12px;font-size:.9rem;cursor:pointer}
.switch input{width:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#2f3a2e;color:#fff;padding:10px 18px;border-radius:99px;font-size:.85rem;z-index:400;opacity:0;transition:.3s;pointer-events:none;max-width:86vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.goal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.pomo-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:.85rem;font-weight:600}
.pomo-strip b{color:var(--green)}
.pomo-card #p-time{font-size:2.6rem;font-weight:800;text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums}
.pomo-card #p-mode{text-align:center;color:var(--green);font-weight:600;margin-top:2px}
.pomo-card #p-task{text-align:center;color:var(--muted);font-size:.85rem}
.p-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:1.2rem;display:block;color:var(--green)}
.stat span{font-size:.75rem;color:var(--muted)}
.row2{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.r-stat{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.r-stat b{color:var(--green)}
.m-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.m-top h2{margin:0}
.m-mid{display:flex;align-items:stretch;gap:8px;margin-top:10px;flex-wrap:wrap}
.m-left{flex:1;min-width:0}
.m-ldgrow{display:flex;align-items:center;gap:8px}
.m-ldgrow .m-ldg{flex:none;width:auto;min-width:70px;max-width:46vw;font-size:.85rem;padding:6px 8px}
.m-ldgrow .mg{padding:6px 9px}
.m-tools{display:flex;align-items:center;gap:6px;margin-top:8px}
.m-add.btn{align-self:center;flex:none;white-space:nowrap;padding:9px 16px;font-size:.9rem;border-radius:10px}
.m-total{display:flex;align-items:center;margin-top:2px}
.m-total input{flex:1;min-width:0}
.m-total .btn{flex:none;white-space:nowrap}
.m-bgcats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.m-cc{display:flex;align-items:center;gap:4px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.m-cc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:.82rem}
.m-cc .btn{padding:3px 5px;font-size:.68rem;flex:none}
.m-bgcats.m-modal{margin-top:0}
.m-nav{display:flex;align-items:center;gap:6px}
.m-nav b{font-size:.95rem;min-width:64px;text-align:center}
.m-donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.m-donut .donut{width:128px;height:128px;flex:none}
.donut-n{font-size:14px;font-weight:700;fill:var(--ink)}
.donut-l{font-size:8px;fill:var(--muted)}
.m-legend{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);gap:2px 10px}
.m-lg{display:flex;align-items:center;gap:5px;padding:4px 0;font-size:.78rem;min-width:0}
.m-lg .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-lg small{color:var(--muted);width:40px;text-align:right}
.m-sum .m-uns{color:var(--muted)}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-chev{margin-left:auto;transition:transform .18s}
.nav-chev.open{transform:rotate(180deg)}
.nav-subs{display:flex;flex-direction:column;gap:2px;margin-left:12px;padding-left:8px;border-left:2px solid var(--line)}
.nav-subs .nav-i{padding:7px 10px;font-size:.86rem;font-weight:500}
.memo-tabs,.report-tabs{display:none;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.memo-tabs button,.report-tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:8px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.memo-tabs button.on,.report-tabs button.on{background:var(--green);color:#fff;font-weight:600}
.memo-tabs .ic,.report-tabs .ic{width:14px;height:14px}
.memo-page{padding-top:66px}
.memo-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.memo-head h4{margin:0;flex:1}
.memo-sec{font-size:.82rem;color:var(--muted);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.memo-sec small{background:var(--card2);border-radius:99px;padding:0 7px;font-size:.7rem}
.memo-sec.over{color:var(--danger)}
.memo-sec.done{color:var(--muted)}
.memo-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:.85rem}
.memo-row:last-child{border-bottom:none}
.memo-row.is-done{opacity:.55;background:var(--card2);border-radius:8px}
.memo-row .memo-info{flex:1;min-width:0}
.memo-row .memo-info b{display:block;font-size:.88rem}
.memo-row .memo-info small{display:block;color:var(--muted);font-size:.74rem;margin-top:1px}
.memo-badge{flex:none;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.memo-badge.memo-ok{color:var(--green);background:rgba(76,154,106,.12)}
.memo-badge.memo-warn{color:var(--warn);background:rgba(217,146,46,.15)}
.memo-badge.memo-today{color:var(--amber);background:rgba(192,138,62,.15)}
.memo-badge.memo-tomorrow{color:var(--blue);background:rgba(62,124,177,.12)}
.memo-badge.memo-over{color:#fff;background:var(--danger)}
.memo-badge.memo-done{color:var(--muted);background:var(--card2)}
.memo-row .btn{padding:4px 7px;font-size:.72rem}
.cl-season{flex:none;width:22px;height:22px;border-radius:50%;color:#fff;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.closet-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px;align-items:start}
.closet-grid{display:grid;grid-template-columns:1fr;gap:8px}
.closet-grid .memo-row{border:1px solid var(--line);border-radius:10px;background:#fff}
.closet-grid .memo-row:last-child{border:1px solid var(--line)}
.closet-grid .memo-info small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-chip.event{background:var(--amber);border-left-color:rgba(255,255,255,.5)}
.cal-chip.event .ic{width:9px;height:9px;vertical-align:-1px}

.m-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.m-sum>div{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.m-sum span{display:block;font-size:.72rem;color:var(--muted)}
.m-sum b{font-size:1.02rem}
.m-bill{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:.85rem;cursor:pointer}
.m-bill:last-child{border-bottom:none}
.m-bill:hover{background:var(--card2);border-radius:8px}
.od{color:var(--danger);font-weight:700}
.quote p{font-size:.85rem;line-height:1.7}
@media(max-width:1180px){#rail{display:none}}
@media(max-width:768px){
#app{flex-direction:column;padding:10px 12px 80px;align-items:stretch}
.m-sum{grid-template-columns:repeat(2,1fr)}
.m-legend{grid-template-columns:repeat(2,1fr)}
.m-bgcats{grid-template-columns:repeat(2,1fr)}
.closet-grid{grid-template-columns:1fr}
.closet-cats{grid-template-columns:1fr}
.memo-tabs,.report-tabs{display:flex}
.memo-page{padding-top:0}
.m-total{justify-content:center}
.m-total input{flex:0 1 260px}
#sidebar{display:none}
#mhead{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.layers{grid-template-columns:1fr}
#tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;background:rgba(252,253,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabbar .nav-i{flex-direction:column;gap:2px;font-size:.68rem;font-weight:700;padding:6px 0;border-radius:10px;justify-content:center;text-align:center}
#tabbar .nav-i .ic{width:20px;height:20px}
.todo{flex-direction:column}
.todo .t-actions{width:100%;justify-content:flex-end}
.g-head{flex-direction:column;align-items:center;text-align:center}
.g-head .g-info{width:100%}
.g-head .g-meta{justify-content:center}
.g-head .g-tags{justify-content:center}
.g-head .g-tags .btn{margin-left:0!important}
.stat-grid{grid-template-columns:repeat(2,1fr)}
.goal-grid{grid-template-columns:1fr}
.p-cats{grid-template-columns:repeat(2,1fr)}
.cal-cell{min-height:56px}
.cal-head{justify-content:center;text-align:center}
.cal-wcol{min-height:120px}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c6d2be;border-radius:99px}

/* 重要倒计时 */
.cd-card .cd-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
.cd-card .cd-item.done{opacity:.55}
.cd-card .cd-item.cd-today{background:rgba(76,154,106,.08);border-color:var(--green)}
.cd-card .cd-item.cd-past{opacity:.7}
.cd-info{flex:1;min-width:0}
.cd-info b{display:block;font-size:.88rem}
.cd-info span{color:var(--muted);font-size:.75rem}
.cd-actions{display:flex;gap:6px;flex:none}
.cd-actions .cd-left{color:var(--danger);font-weight:700;font-size:.78rem;white-space:nowrap;align-self:center}
.cd-hidden{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.todo.today-done{opacity:.62}
.cd-card{margin-top:12px}
.layers{margin-top:12px}
.badge-card h2 .ic{width:15px;height:15px;color:var(--green)}

/* ========== 连续打卡 ========== */
function streakInfo(){
const set=new Set(DB.checkins.map(c=>c.date));
let anchor=new Date();
if(!set.has(fmt(anchor)))anchor=addDays(anchor,-1);
if(!set.has(fmt(anchor)))return {streak:0,lastDate:null,activeDays7:0};
let min=null;
DB.checkins.forEach(c=>{const d=parseD(c.date);if(!min||d<min)min=d;});
let streak=0,win=[],d=new Date(anchor);
while(d>=min){
const act=set.has(fmt(d));
win.push(act);if(win.length>7)win.shift();
if(win.filter(x=>!x).length>1)break;
streak++;d=addDays(d,-1);
}
let a7=0;for(let i=0;i<7;i++){if(set.has(fmt(addDays(new Date(),-i))))a7++;}
return {streak,lastDate:fmt(anchor),activeDays7:a7};
}

function reportCkSummary(chk,empty){
const L=[];
if(!chk.length){L.push('（'+empty+'）');return L;}
const typeDist={},themeDist={};
chk.forEach(c=>{typeDist[c.type]=(typeDist[c.type]||0)+1;(c.themes||[]).forEach(th=>{themeDist[th]=(themeDist[th]||0)+1;});});
const typeStr=Object.entries(typeDist).map(e=>e[0]+'×'+e[1]).join('、');
if(typeStr)L.push('类型分布：'+typeStr);
const themeStr=Object.entries(themeDist).sort((a,b)=>b[1]-a[1]).map(e=>e[0]+'×'+e[1]).join('、');
if(themeStr)L.push('主题分布：'+themeStr);
const byDay={};
chk.forEach(c=>{(byDay[c.date]=byDay[c.date]||[]).push(c);});
Object.keys(byDay).sort().forEach(ds=>{
const arr=byDay[ds];
const tdist={};arr.forEach(c=>{tdist[c.type]=(tdist[c.type]||0)+1;});
const ts=Object.entries(tdist).map(e=>e[0]+'×'+e[1]).join('、');
const first=arr[0];
let sum=(first&&first.content&&first.content.trim())||(Number(first&&first.amount)>0?('+'+first.amount+(first.unit||'')):'');
sum=String(sum).length>40?String(sum).slice(0,40)+'…':String(sum);
L.push('- '+ds+'（'+arr.length+' 条：'+ts+'）'+(sum?' '+sum:''));
});
const seen=new Set();
const hl=chk.filter(c=>(c.content&&c.content.trim())||Number(c.amount)>0).filter(c=>{const k=c.date+'|'+c.type+'|'+(c.content||'')+'|'+(c.amount||0);if(seen.has(k))return false;seen.add(k);return true;}).slice(-5).reverse();
if(hl.length){L.push('精选亮点：');hl.forEach(c=>L.push('- '+ckLine(c)+'（'+c.date+'）'));}
return L;
}
function reportGoalProgress(goals,chk,doneList,label){
const L=[],pushed=new Set();
if(goals.length){
const goalTasks={};
DB.tasks.forEach(t=>{if(t.goalId)(goalTasks[t.goalId]=goalTasks[t.goalId]||[]).push(t.id);});
goals.forEach(g=>{
const pct=clamp(Math.round(g.current/g.target*100),0,100);
const tids=goalTasks[g.id]||[];
const ckPush=chk.filter(c=>c.taskId&&tids.indexOf(c.taskId)>=0).length;
const dnPush=doneList.filter(t=>t.goalId===g.id).length;
if(ckPush||dnPush)pushed.add(g.id);
L.push('- '+g.title+'：'+g.current+'/'+g.target+'（'+pct+'%）'+(ckPush||dnPush?(' · '+label+' 打卡 '+ckPush+' / 完成 '+dnPush):''));
});
}else L.push('（还没有目标）');
return {lines:L,pushed:pushed};
}

function buildMonthReport(){
const p=monthYMCur().split('-');const y=Number(p[0]),m=Number(p[1])-1;
const ym=y+'-'+pad(m+1);
const ys=fmt(new Date(y,m,1));
const ye=fmt(new Date(y,m+1,0));
const dims=new Date(y,m+1,0).getDate();
const chk=DB.checkins.filter(c=>c.date>=ys&&c.date<=ye).sort((a,b)=>a.date.localeCompare(b.date));
const days=new Set(chk.map(c=>c.date)).size;
const done=DB.tasks.filter(t=>t.status==='done'&&t.completedAt&&t.completedAt.slice(0,10)>=ys&&t.completedAt.slice(0,10)<=ye);
const pys=fmt(new Date(y,m-1,1));
const pye=fmt(new Date(y,m,0));
const prevChk=DB.checkins.filter(c=>c.date>=pys&&c.date<=pye);
const prevDays=new Set(prevChk.map(c=>c.date)).size;
const prevDone=DB.tasks.filter(t=>t.status==='done'&&t.completedAt&&t.completedAt.slice(0,10)>=pys&&t.completedAt.slice(0,10)<=pye);
const overdue=DB.tasks.filter(t=>t.status==='todo'&&t.dueDate&&t.dueDate<todayStr());
const msM=moneyMonthSummary(ym);
const L=[];
L.push('【CC的工作台 · 本月复盘】');
L.push('周期：'+ym);
L.push('');
L.push('一、本月概览');
L.push('打卡 '+days+'/'+dims+' 天 · 完成 '+done.length+' 项 · 本月结余 '+msM.sym+fmtMoney(msM.balance));
let summ='本月打卡 '+days+'/'+dims+' 天，'+(days>=20?'状态很好，继续保持':days>=12?'整体节奏平稳':'打卡偏少，需调整节奏')+'。';
if(done.length)summ+='完成 '+done.length+' 项任务。';
if(days>prevDays)summ+='较上月多打卡 '+(days-prevDays)+' 天。';
else if(days<prevDays)summ+='较上月少打卡 '+(prevDays-days)+' 天，注意调整。';
L.push('总结：'+summ);
L.push('');
L.push('二、打卡与行动汇总（'+days+' 天 / '+chk.length+' 条）');
L.push.apply(L,reportCkSummary(chk,'本月暂无打卡'));
L.push('');
L.push('三、本月完成与成果（'+done.length+' 项）');
[...done].sort((a,b)=>(a.category==='工作'?0:1)-(b.category==='工作'?0:1)||String(a.completedAt||'').localeCompare(String(b.completedAt||''))).forEach(t=>L.push('- '+(t.category==='工作'?'[工作] ':'')+t.title+'：'+(t.summary||'（未填成果摘要）')));
if(!done.length)L.push('（本月暂无完成项）');
L.push('');
L.push('四、目标进度');
const gpM=reportGoalProgress(DB.goals,chk,done,'本月推进');
L.push.apply(L,gpM.lines);
L.push('');
L.push('五、问题与风险');
if(overdue.length){
L.push('逾期未完成任务（'+overdue.length+' 项）：');
overdue.slice(0,10).forEach(t=>L.push('- '+t.title+'（截止 '+t.dueDate+'）'));
if(overdue.length>10)L.push('（还有 '+(overdue.length-10)+' 项未列出）');
}else L.push('暂无逾期任务');
const dec=[];
if(prevDays>days)dec.push('打卡天数 '+prevDays+'→'+days+' ↓'+(prevDays-days));
if(prevChk.length>chk.length)dec.push('打卡条数 '+prevChk.length+'→'+chk.length+' ↓'+(prevChk.length-chk.length));
if(prevDone.length>done.length)dec.push('完成项 '+prevDone.length+'→'+done.length+' ↓'+(prevDone.length-done.length));
if(dec.length)L.push('较上月下降：'+dec.join('、'));
L.push('');
L.push('六、本月数据');
L.push('打卡天数：'+days+' 天');
L.push('完成项：'+done.length+' 项');
L.push('当前逾期任务：'+overdue.length+' 项');
L.push('本月收支（主账本）：支出 '+msM.sym+fmtMoney(msM.exp)+'，收入 '+msM.sym+fmtMoney(msM.inc)+'，结余 '+msM.sym+fmtMoney(msM.balance));
L.push('环比（上月→本月）：打卡天数 '+prevDays+'→'+days+'、完成项 '+prevDone.length+'→'+done.length);
L.push('');
L.push('七、复盘思考');
L.push('做得好的：（在此填写）');
L.push('待改进的：（在此填写）');
L.push('下一步行动：（在此填写）');
L.push('');
const nxtM=DB.tasks.filter(t=>t.status==='todo'&&t.dueDate&&t.dueDate>=fmt(new Date(y,m+1,1))&&t.dueDate<=fmt(new Date(y,m+2,0))).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
L.push('八、下月计划（下月到期）');
if(nxtM.length)nxtM.forEach(t=>L.push('- '+t.dueDate+' '+t.title));

L.push('- 风险：'+(overdue.length?'逾期任务 '+overdue.length+' 项':'暂无逾期'));
L.push('- 计划：'+(nxtM.length?'下月有 '+nxtM.length+' 项任务到期':'下月暂无到期任务'));

return '<section class="card">'+calHead(fmt(ws)+' ~ '+fmt(addDays(ws,6)))+

}

/* ========== 云同步（Netlify Blobs） ========== */
const SYNC_ENDPOINT='/.netlify/functions/sync';
let syncTimer=null;
function syncEnabled(){return !!(DB.settings.sync&&DB.settings.sync.enabled&&DB.settings.sync.key);}
function syncSet(partial){DB.settings.sync=Object.assign({enabled:false,key:'',lastSyncAt:null,serverUpdatedAt:0},DB.settings.sync||{},partial);}
function scheduleSyncPush(){if(!syncEnabled())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncPush().catch(()=>{});},1500);}
async function syncPush(){
  if(!syncEnabled())return false;
  const payload=JSON.parse(JSON.stringify(DB));
  try{
    const res=await fetch(SYNC_ENDPOINT+'?key='+encodeURIComponent(DB.settings.sync.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)return false;
    const j=await res.json();
    const merged=j&&j.data;
    if(!merged||!merged.meta)return false;
    const before=syncSig(DB);
    const now=Date.now();
    DB=migrate(merged);
    DB.meta.updatedAt=now;
    const changed=syncSig(DB)!==before;
    syncSet({lastSyncAt:now,serverUpdatedAt:merged.meta.updatedAt||0});
    localStorage.setItem(LS_KEY,JSON.stringify(DB));
    if(changed){render();showToast('已与云端合并，拉到最新数据');}
    return true;
  }catch(e){return false;}
}
function syncSig(d){
  const s=d.settings||{};
  return JSON.stringify([d.goals,d.tasks,d.checkins,d.events,d.pomodoros,d.ledgers,d.bills,d.memos,d.clothes,d.deleted,s.rewards,s.kw,s.expCats,s.holidays,s.budget,s.autoDefer]);
}
async function syncNow(){
  if(!syncEnabled()){showToast('请先开启云同步并填写同步密码');return;}
  const ok=await syncPush();
  showToast(ok?('同步完成，上次同步 '+((DB.settings.sync.lastSyncAt)?new Date(DB.settings.sync.lastSyncAt).toLocaleString():'刚刚')):'同步失败，请检查网络后重试');
}
function setSyncEnabled(v){syncSet({enabled:v});save();if(v){syncNow();}render();}
function setSyncKey(v){syncSet({key:String(v||'').trim()});save();}
/* ========== 任务操作 ========== */
function goalAdd(id,delta){const g=DB.goals.find(x=>x.id===id);if(!g)return false;g.current=Math.max(0,(Number(g.current)||0)+delta);g.updatedAt=Date.now();return true;}
function done(id){
const t=DB.tasks.find(x=>x.id===id);if(!t)return;
if(t.period&&t.status==='todo'&&isPeriodDay(t,todayStr())){
const T=todayStr();
if(!(t.doneDates||[]).includes(T)){t.doneDates=(t.doneDates||[]).concat(T);if(t.goalId)goalAdd(t.goalId,1);}
t.updatedAt=Date.now();settlePeriods();save();render();showToast('今日已完成，明天继续');return;
}
t.status='done';t.progress=100;t.completedAt=nowStamp();t.updatedAt=Date.now();if(t.goalId)goalAdd(t.goalId,1);save();render();showToast('已完成，求上进！');
}
function defer(id){const t=DB.tasks.find(x=>x.id===id);if(!t)return;t.dueDate=fmt(addDays(new Date(),1));t.deferCount=(t.deferCount||0)+1;t.updatedAt=Date.now();save();render();showToast('已顺延到明天');}

tid=editId||null;
const pf=(prefill&&typeof prefill==='object')?prefill:{date:prefill||todayStr(),time:null};
const d=pf.date;
const pfEnd=pf.time?timeAdd(pf.time,60):'';
const period=!!(t&&t.period);
const wd=(t&&Array.isArray(t.weekdays))?t.weekdays:[1,2,3,4,5,6,0];

function isHoliday(ds){return (DB.settings.holidays||[]).includes(ds);}
function periodWeekdays(t){
const wd=(t.weekdays&&t.weekdays.length)?t.weekdays:[0,1,2,3,4,5,6];
if(wd.length===7)return '每日';
const names=wd.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(n=>'周'+WEEK_CN[n]);
return '每周'+wd.length+'次 · '+names.join('');
}
function isPeriodDay(t,ds){
if(!t.period||!t.startDate||!t.dueDate)return false;
if(ds<t.startDate||ds>t.dueDate)return false;
const wd=(t.weekdays&&t.weekdays.length)?t.weekdays:[0,1,2,3,4,5,6];
if(!wd.includes(parseD(ds).getDay()))return false;
if(t.skipHolidays&&isHoliday(ds))return false;
return true;
}
function periodTotal(t){if(!t.period||!t.startDate||!t.dueDate)return 0;let n=0;for(let d=parseD(t.startDate);fmt(d)<=t.dueDate;d=addDays(d,1)){if(isPeriodDay(t,fmt(d)))n++;}return n;}
function periodDoneCount(t){if(!t.period)return 0;return (t.doneDates||[]).filter(ds=>t.startDate<=ds&&ds<=t.dueDate).length;}
function periodProgress(t){const tot=periodTotal(t);return tot?Math.round(periodDoneCount(t)/tot*100):0;}
function settlePeriods(){
const T=todayStr();let changed=false;
DB.tasks.forEach(t=>{
if(!t.period||t.status==='done'||!t.startDate||!t.dueDate)return;
if(T<=t.dueDate)return;
if(periodDoneCount(t)>=periodTotal(t)){t.status='done';t.progress=100;t.completedAt=t.dueDate+' 23:59';t.updatedAt=Date.now();changed=true;}
});
if(changed)save();
}
function undoDone(id){const t=DB.tasks.find(x=>x.id===id);if(!t)return;const T=todayStr();if((t.doneDates||[]).includes(T)){t.doneDates=(t.doneDates||[]).filter(d=>d!==T);if(t.goalId)goalAdd(t.goalId,-1);}t.updatedAt=Date.now();save();render();showToast('已撤销今日完成');}

function pomoDayStats(ds){const x=ds||todayStr();const ps=(DB.pomodoros||[]).filter(p=>p.date===x);return {min:ps.reduce((a,p)=>a+Number(p.min||0),0),n:ps.length};}
function fmtMin(sec){sec=Math.max(0,Math.floor(Number(sec)||0));return pad(Math.floor(sec/60))+':'+pad(sec%60);}
function pomoTimeText(){
if(!pomo||!pomo.active){return (pomo&&pomo.mode==='up')?'00:00':'25:00';}
if(pomo.running){const now=Date.now();if(pomo.mode==='up')return fmtMin((pomo.accSec||0)+Math.floor((now-pomo.startedAt)/1000));return fmtMin(Math.max(0,Math.round((pomo.endAt-now)/1000)));}
if(pomo.mode==='up')return fmtMin(pomo.accSec||0);
return fmtMin(pomo.leftSec||0);
}
function pomoPaint(){
const t=$('#p-time');if(t)t.textContent=pomoTimeText();
const m=$('#p-mode');if(m)m.textContent=pomo.active?(pomo.mode==='break'?'休息倒计时':pomo.mode==='up'?'正计时':'专注倒计时'):'准备开始';
const tk=$('#p-task');if(tk){const nm=pomo.taskId?((DB.tasks.find(x=>x.id===pomo.taskId)||{}).title||''):'';tk.textContent=pomo.active?(pomo.mode==='break'?(nm?nm+' · 休息':'休息'):(nm||'未选择任务')):'未选择任务';}
const idle=!pomo||!pomo.active;
const st=$('#p-start');if(st)st.style.display=idle?'flex':'none';
const ctrl=$('#p-ctrl');if(ctrl){ctrl.style.display=idle?'none':'flex';ctrl.innerHTML=pomo.running?'<button class="btn sm" onclick="App.pomoPause()">暂停</button><button class="btn sm" onclick="App.pomoStop()">结束并记录</button><button class="btn sm" onclick="App.pomoCancel()">取消</button>':'<button class="btn sm primary" onclick="App.pomoResume()">继续</button><button class="btn sm" onclick="App.pomoStop()">结束并记录</button><button class="btn sm" onclick="App.pomoCancel()">取消</button>';}

}
function pomoLoop(){
if(!pomo||!pomo.running)return;
const now=Date.now();
if(pomo.mode!=='up'){
const left=Math.max(0,Math.round((pomo.endAt-now)/1000));
if(left<=0){pomoComplete();return;}
pomo.leftSec=left;
}
pomoPaint();
}
let pomoTimer=null;
function pomoStartTimer(){if(!pomoTimer)pomoTimer=setInterval(pomoLoop,1000);}
function pomoStopTimer(){if(pomoTimer){clearInterval(pomoTimer);pomoTimer=null;}}
function recordPomo(sec){
if(!pomo||!pomo.taskId||pomo.mode==='break')return 0;
const min=Math.max(0,Math.floor(sec/60));
if(min<1)return 0;
const now=new Date();
const em=Math.min(1439,Math.round(now.getHours()*60+now.getMinutes()));
const sm=Math.max(0,em-min);
DB.pomodoros.push({id:uid(),taskId:pomo.taskId,date:todayStr(),start:pad(Math.floor(sm/60))+':'+pad(sm%60),end:pad(Math.floor(em/60))+':'+pad(em%60),min:min,mode:pomo.mode==='up'?'up':'focus',createdAt:Date.now()});
const t=DB.tasks.find(x=>x.id===pomo.taskId);
if(t){t.startTime=pad(Math.floor(sm/60))+':'+pad(sm%60);t.endTime=pad(Math.floor(em/60))+':'+pad(em%60);t.updatedAt=Date.now();}
return min;
}
function pomoReset(){pomo={running:false,active:false,mode:'focus',taskId:null,planMin:25,startedAt:0,endAt:0,leftSec:0,accSec:0};savePomo();pomoStopTimer();}
function pomoStart(taskId,mode){
const id=taskId||($('#p-task-sel')?$('#p-task-sel').value:'');
const t=DB.tasks.find(x=>x.id===id);if(!t){showToast('请先选择任务');return;}
const m=Number($('#p-min')&&$('#p-min').value)||25;
const isUp=mode==='up';
pomo={running:true,active:true,mode:isUp?'up':'focus',taskId:id,planMin:isUp?0:m,startedAt:Date.now(),endAt:0,leftSec:0,accSec:0};
if(!isUp){pomo.endAt=pomo.startedAt+m*60000;pomo.leftSec=m*60;}
savePomo();pomoStartTimer();render();pomoPaint();
}
function pomoStartUp(){pomoStart(null,'up');}
function pomoPause(){
if(!pomo||!pomo.running)return;
const now=Date.now();
if(pomo.mode==='up')pomo.accSec=(pomo.accSec||0)+Math.floor((now-pomo.startedAt)/1000);
else pomo.leftSec=Math.max(0,Math.round((pomo.endAt-now)/1000));
pomo.running=false;savePomo();pomoStopTimer();pomoPaint();
}
function pomoResume(){
if(!pomo||!pomo.active||pomo.running)return;
pomo.startedAt=Date.now();
if(pomo.mode!=='up')pomo.endAt=pomo.startedAt+(pomo.leftSec||0)*1000;
pomo.running=true;savePomo();pomoStartTimer();pomoPaint();
}
function pomoStop(){
if(!pomo||!pomo.active)return;
const now=Date.now();
let sec=0;
if(pomo.mode==='up')sec=(pomo.accSec||0)+Math.floor((now-pomo.startedAt)/1000);
else sec=(pomo.planMin*60)-Math.max(0,Math.round((pomo.endAt-now)/1000));
const rec=(pomo.mode!=='break')?recordPomo(sec):0;
pomoReset();save();render();
showToast(rec>0?('已记录 '+rec+' 分钟'):'不足 1 分钟，未记录');
}
function pomoComplete(){
if(!pomo||!pomo.running)return;
if(pomo.mode==='break'){pomoReset();save();render();showToast('休息结束，继续加油');return;}
const rec=pomo.taskId?recordPomo(pomo.planMin*60):0;
const todayN=pomoDayStats().n;
const brk=todayN>0&&todayN%4===0?15:5;
pomoReset();save();render();
if(rec>0){
openModal('<h3>'+icon('tomato')+'专注完成</h3><p class="md-body">本次专注 '+rec+' 分钟已记录，今日已专注 '+todayN+' 次'+(brk===15?'，连续 4 轮建议长休':'')+'。</p><div class="md-actions"><button class="btn" onclick="App.closeModal();App.pomoSkipBreak()">跳过休息</button><button class="btn primary" onclick="App.closeModal();App.pomoBreak('+brk+')">休息 '+brk+' 分钟</button></div>');
}else{showToast('专注完成（不足 1 分钟未记录）');}
}
function pomoBreak(min){
const taskId=pomo?pomo.taskId:null;
pomo={running:true,active:true,mode:'break',taskId:taskId,planMin:Number(min)||5,startedAt:Date.now(),endAt:0,leftSec:0,accSec:0};
pomo.endAt=pomo.startedAt+pomo.planMin*60000;pomo.leftSec=pomo.planMin*60;
savePomo();pomoStartTimer();render();pomoPaint();
}

function moneyCatRename(oldCat){
const v=($('#mec-name')||{}).value||'';
const c=String(v).trim();
if(!c){showToast('请输入分类名称');return;}
if(c.length>6){showToast('分类名称最多 6 个字');return;}
if(/['"]/.test(c)){showToast('分类名不能包含引号');return;}
if(c===oldCat){moneyCatManage();return;}
if(allExpCats().includes(c)){showToast('分类已存在');return;}
DB.settings.expCats=allExpCats().map(x=>x===oldCat?c:x);
Object.keys(DB.settings.budget||{}).forEach(k=>{const b=DB.settings.budget[k];if(b&&b.categories&&oldCat in b.categories){b.categories[c]=b.categories[oldCat];delete b.categories[oldCat];}});
(DB.bills||[]).forEach(b=>{if(b.category===oldCat)b.category=c;});
save();render();showToast('已重命名');moneyCatManage();
}
function moneyCatDel(cat){
if(allExpCats().length<=1){showToast('至少保留一个支出分类');return;}
confirmModal('删除分类','删除分类「'+esc(cat)+'」？各账本中该分类的预算设置会一并清除，历史账单保留（图表按灰色显示）。','删除').then(ok=>{if(!ok)return;
DB.settings.expCats=allExpCats().filter(x=>x!==cat);
Object.keys(DB.settings.budget||{}).forEach(k=>{if(DB.settings.budget[k]&&DB.settings.budget[k].categories)delete DB.settings.budget[k].categories[cat];});
save();render();showToast('已删除分类');moneyCatManage();
});
}

function closetWear(id){
const c=DB.clothes.find(x=>x.id===id);if(!c)return;
c.wearCount=(c.wearCount||0)+1;c.lastWorn=todayStr();c.updatedAt=Date.now();save();render();showToast('已记录穿着');
}
function closetUnwear(id){
const c=DB.clothes.find(x=>x.id===id);if(!c)return;
c.wearCount=Math.max(0,(c.wearCount||0)-1);c.updatedAt=Date.now();save();render();showToast('已减少一次');
}
function closetArchive(id){
const c=DB.clothes.find(x=>x.id===id);if(!c)return;
c.status=c.status==='archived'?'in':'archived';c.updatedAt=Date.now();save();render();showToast(c.status==='archived'?'已归档':'已恢复');
}
